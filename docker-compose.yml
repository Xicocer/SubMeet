services:
  mysql:
    image: mysql:8.0
    container_name: diploma-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - diploma-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: diploma-rabbitmq
    restart: unless-stopped
    profiles:
      - docker-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - diploma-network

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    container_name: diploma-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: submeet-meili-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - diploma-network

  loki:
    image: grafana/loki:3.2.1
    container_name: diploma-loki
    restart: unless-stopped
    profiles:
      - observability
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - diploma-network

  promtail:
    image: grafana/promtail:3.2.1
    container_name: diploma-promtail
    restart: unless-stopped
    profiles:
      - observability
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./services:/workspace/services:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - diploma-network

  grafana:
    image: grafana/grafana:11.2.2
    container_name: diploma-grafana
    restart: unless-stopped
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - diploma-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./services/auth-service:/var/www
    environment:
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      LOG_STACK: single,json
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: submeet_auth
      DB_USERNAME: diploma
      DB_PASSWORD: secret
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - diploma-network

  event-service:
    build:
      context: ./services/event-service
      dockerfile: Dockerfile
    container_name: event-service
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./services/event-service:/var/www
    environment:
      APP_URL: http://localhost:8001
      LOG_CHANNEL: stack
      LOG_STACK: single,json
      AUTH_SERVICE_URL: http://auth-service:8000/api
      HALLS_SERVICE_URL: http://halls-service:8000/api
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000/api
      INTERNAL_API_KEY: submeet-internal-key
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: submeet-meili-key
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: submeet_event
      DB_USERNAME: diploma
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8001:8000"
    depends_on:
      - mysql
      - meilisearch
    networks:
      - diploma-network

  halls-service:
    build:
      context: ./services/halls-service
      dockerfile: Dockerfile
    container_name: halls-service
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./services/halls-service:/var/www
    environment:
      APP_URL: http://localhost:8002
      LOG_CHANNEL: stack
      LOG_STACK: single,json
      AUTH_SERVICE_URL: http://auth-service:8000/api
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: submeet_halls
      DB_USERNAME: diploma
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8002:8000"
    depends_on:
      - mysql
    networks:
      - diploma-network

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./services/booking-service:/var/www
    environment:
      APP_URL: http://localhost:8003
      LOG_CHANNEL: stack
      LOG_STACK: single,json
      AUTH_SERVICE_URL: http://auth-service:8000/api
      EVENT_SERVICE_URL: http://event-service:8000/api
      HALL_SERVICE_URL: http://halls-service:8000/api
      INTERNAL_API_KEY: submeet-internal-key
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: submeet_booking
      DB_USERNAME: diploma
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8003:8000"
    depends_on:
      - mysql
    networks:
      - diploma-network

  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation-service
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./services/recommendation-service:/app
      - ./ml_recommended:/workspace/ml_recommended
    environment:
      APP_NAME: SubMeet Recommendation Service
      APP_ENV: local
      LOG_LEVEL: INFO
      LOG_SERVICE_NAME: recommendation-service
      DATA_SOURCE: hybrid
      AUTH_SERVICE_URL: http://auth-service:8000/api
      EVENT_SERVICE_URL: http://event-service:8000/api
      BOOKING_SERVICE_URL: http://booking-service:8000/api
      INTERNAL_API_KEY: submeet-internal-key
      ML_WORKSPACE: /workspace/ml_recommended
      AUTO_TRAIN_IF_MISSING: "true"
      ALLOW_SYNTHETIC_GENERATION: "true"
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8004:8000"
    networks:
      - diploma-network

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    container_name: admin-service
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./services/admin-service:/var/www
    environment:
      APP_URL: http://localhost:8005
      LOG_CHANNEL: stack
      LOG_STACK: single,json
      AUTH_SERVICE_URL: http://auth-service:8000/api
      EVENT_SERVICE_URL: http://event-service:8000/api
      BOOKING_SERVICE_URL: http://booking-service:8000/api
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8005:8000"
    networks:
      - diploma-network

  frontend:
    image: node:22-alpine
    container_name: diploma-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend/vue-project:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - diploma-network

volumes:
  mysql_data:
  meilisearch_data:
  loki_data:
  grafana_data:
  promtail_positions:

networks:
  diploma-network:
    driver: bridge
